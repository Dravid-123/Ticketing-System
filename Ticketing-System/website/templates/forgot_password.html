{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container" style="max-width: 520px; margin-top: 24px;">
  <div class="card" style="border-radius: 12px;">
    <div class="card-header" style="background:#0b1437; color:#fff; border-radius: 12px 12px 0 0;">
      <h5 class="mb-0"><i class="fas fa-unlock-alt"></i> Reset Password</h5>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <div class="form-group">
          <label for="fp_emp">Employee ID</label>
          <input type="text" id="fp_emp" name="employee_id" class="form-control" placeholder="e.g. EMP12345" required />
        </div>
        <div class="form-group">
          <label for="fp_first">First Name</label>
          <input type="text" id="fp_first" name="first_name" class="form-control" placeholder="Your first name" required />
        </div>
        <div class="form-group">
          <label for="fp_pass1">New Password</label>
          <input type="password" id="fp_pass1" name="new_password" class="form-control" placeholder="At least 7 characters" required />
        </div>
        <div class="form-group">
          <label for="fp_pass2">Confirm New Password</label>
          <input type="password" id="fp_pass2" name="confirm_password" class="form-control" placeholder="Re-enter new password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update Password</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('views.home') }}#login">Back to Login</a>
      </div>
    </div>
  </div>
</div>
<li class="nav-item {% if active_page == 'admin-dashboard' %}active{% endif %}">
    <a class="nav-link" href="{{ url_for('views.adminDashboard') }}">Admin Dashboard</a>
</li>
{% endblock %}
